title: "Notes philosophiques"
description: "Essais et notes de lecture en philosophie"
author: "Ton nom"
url: "https://goniaux.github.io"
baseurl: "/philo-blog"

# Construction du site
markdown: kramdown
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclure du build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
